<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minecraft companion</title>
<meta name="description" content="Minecraft: Java Edition crafting, enchanting, brewing, trading, smithing, banners, food, nether portals, XP and furnace fuel.">
<meta name="theme-color" content="#c7d0c2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2823" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MC Guide">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="tabs" aria-label="Sections"><div class="tabsc">
  <button type="button" data-tab="craft" aria-current="page"><img data-ic="Crafting Table" alt="" width="16" height="16"><span>Crafting</span></button>
  <button type="button" data-tab="ench"><img data-ic="Enchanted Book" alt="" width="16" height="16"><span>Enchanting</span></button>
  <button type="button" data-tab="brew"><img data-ic="Potion of Strength" alt="" width="16" height="16"><span>Brewing</span></button>
  <button type="button" data-tab="trade"><img data-ic="Emerald" alt="" width="16" height="16"><span>Trades</span></button>
  <button type="button" data-tab="smith"><img data-ic="Netherite Upgrade" alt="" width="16" height="16"><span>Smithing</span></button>
  <button type="button" data-tab="banner"><img data-ic="Red Banner" alt="" width="16" height="16"><span>Banners</span></button>
  <button type="button" data-tab="food"><img data-ic="Steak" alt="" width="16" height="16"><span>Food</span></button>
  <button type="button" data-tab="tools"><img data-ic="Compass" alt="" width="16" height="16"><span>Tools</span></button>
</div></nav>
<main class="app" id="tab-craft">
  <header class="top">
    <h1>Crafting</h1>
  </header>
  <section class="search" aria-label="Search">
    <div class="field">
      <input id="q" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Search recipes" placeholder="Search items, like “piston”">
      <button id="clear" type="button" aria-label="Clear search">×</button>
    </div>
    <div class="seg" id="modes" role="group" aria-label="Search type">
      <button type="button" data-m="item" aria-pressed="true">By item</button>
      <button type="button" data-m="ing" aria-pressed="false">By ingredient</button>
    </div>
    <div class="cats" id="cats" role="group" aria-label="Category"></div>
  </section>
  <div class="panel-wrap" id="panel-wrap"><article class="panel" id="panel" aria-live="polite"></article></div>
  <section class="list" id="list" aria-label="Results"></section>
</main>
<main class="ench" id="tab-ench" hidden>
  <header class="top">
    <h1>Enchanting</h1>
  </header>
  <div class="esubs" id="esubs" role="group" aria-label="Enchanting sections"></div>
  <div id="ebody"></div>
</main>
<main class="ench tabx" id="tab-brew" hidden></main>
<main class="ench tabx" id="tab-trade" hidden></main>
<main class="ench tabx" id="tab-smith" hidden></main>
<main class="ench tabx" id="tab-banner" hidden></main>
<main class="ench tabx" id="tab-food" hidden></main>
<main class="ench tabx" id="tab-tools" hidden></main>
<div id="icard" class="icard" hidden><div class="icard-bg" data-icclose="1"></div><div class="icard-box" role="dialog" aria-modal="true" aria-labelledby="icard-title"></div></div>
<button id="navback" class="navback" type="button" hidden></button>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">This guide needs JavaScript turned on.</p></noscript>
<script src="data.js"></script>
<script src="textures.js"></script>
<script src="app.js"></script>
<script src="ench_data.js"></script>
<script src="anvil_core.js"></script>
<script src="ench.js"></script>
<script src="tabs_data.js"></script>
<script src="trims_data.js"></script>
<script src="tabs_brew_trade.js"></script>
<script src="tabs_more.js"></script>
<script src="banner_data.js"></script>
<script src="tabs_banner.js"></script>
<script src="links.js"></script>
<script src="tabs_shell.js"></script>
</body>
</html>
